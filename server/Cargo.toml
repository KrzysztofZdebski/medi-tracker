[package]
name = "meditracker-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "meditracker_server"
path = "src/lib.rs"

[[bin]]
name = "meditracker-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
async-trait = "0.1"
axum = "0.8"
hex = "0.4"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
rand = "0.8"
sha2 = "0.10"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
